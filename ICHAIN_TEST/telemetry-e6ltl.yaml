kind: Telemetry
apiVersion: api.ibm.com/v1
metadata:
  name: telemetry-e6ltl
  namespace: ICHAIN
  version: '1.0'
  tags: []
  labels:
    gatewayTypes:
      - nano
  domain: mcp
spec:
  attributes:
    api_id: API_001
    api_name: ICHAIN_DIAGNOSTICS_API
  verbosity:
    - level: normal
      onSuccessTrimTo: basic
      operations:
        - path: /api/diagnostic/anomalies
        - path: /api/diagnostic/ingestion-health
        - path: /api/diagnostic/overview
        - method: GET
        - path: /api/diagnostic/period-comparisons
        - method: POST
        - method: PUT
        - method: DELETE
        - method: PATCH
        - method: HEAD
        - method: OPTIONS
      inboundLevel: detailed
      outboundLevel: detailed
