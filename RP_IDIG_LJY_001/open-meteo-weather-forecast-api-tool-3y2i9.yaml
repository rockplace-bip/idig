                - cape
                - lightning_potential
                - is_day
          elevation:
            description: elevation parameter
            x-parameter-location: query
            type: number
            format: float
          temperature_unit:
            description: temperature_unit parameter
            x-parameter-location: query
            type: string
            default: celsius
            enum:
              - celsius
              - fahrenheit
          wind_speed_unit:
            description: wind_speed_unit parameter
            x-parameter-location: query
            type: string
            default: kmh
            enum:
              - kmh
              - ms
              - mph
              - kn
          precipitation_unit:
            description: precipitation_unit parameter
            x-parameter-location: query
            type: string
            default: mm
            enum:
              - mm
              - inch
          timeformat:
            description: If format unixtime is selected, all time values are returned in
              UNIX epoch time.
            x-parameter-location: query
            type: string
            default: iso8601
            enum:
              - iso8601
              - unixtime
          timezone:
            description: Any IANA time zone name is supported. Use auto to resolve the local
              time zone.
            x-parameter-location: query
            type: string
          past_days:
            description: Return past days of data.
            x-parameter-location: query
            type: integer
            default: 0
            minimum: 0
            maximum: 92
          forecast_days:
            description: Number of forecast days.
            x-parameter-location: query
            type: integer
            default: 7
            minimum: 0
            maximum: 16
          past_hours:
            description: past_hours parameter
            x-parameter-location: query
            type: integer
          forecast_hours:
            description: forecast_hours parameter
            x-parameter-location: query
            type: integer
          start_date:
            description: Start date of the time interval in ISO 8601 format.
            x-parameter-location: query
            type: string
            format: date
          end_date:
            description: End date of the time interval in ISO 8601 format.
            x-parameter-location: query
            type: string
            format: date
          tilt:
            description: Slope tilt in degrees for global_tilted_irradiance calculation.
            x-parameter-location: query
            type: number
            format: float
            default: 0
          azimuth:
            description: Azimuth for global_tilted_irradiance. North=0, East=90, South=180,
              West=270.
            x-parameter-location: query
            type: number
            format: float
            default: 0
          cell_selection:
            description: "Grid cell selection preference: land, sea, or nearest."
            x-parameter-location: query
            type: string
            enum:
              - land
              - sea
              - nearest
          apikey:
            description: Only required for commercial subscriptions.
            x-parameter-location: query
            type: string
          models:
            description: Manually select one or more weather models.
            x-parameter-location: query
            type: array
            items:
              type: string
              enum:
                - best_match
                - ecmwf_ifs
                - ecmwf_ifs025
                - ecmwf_aifs025_single
                - cma_grapes_global
