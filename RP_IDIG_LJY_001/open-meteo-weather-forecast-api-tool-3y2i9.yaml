                - surface_pressure
                - wind_speed_10m
                - wind_direction_10m
                - wind_gusts_10m
          minutely_15:
            description: A list of weather variables at 15-minute intervals.
            x-parameter-location: query
            type: array
            items:
              type: string
              enum:
                - temperature_2m
                - relative_humidity_2m
                - dew_point_2m
