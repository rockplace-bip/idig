openapi: 3.0.1
info:
  title: petstore3byWMAGW
  description: "This is a sample server Petstore server.  You can find out more
    about Swagger at [http://swagger.io](http://swagger.io) or on
    [irc.freenode.net, #swagger](http://swagger.io/irc/).  For this sample, you
    can use the api key `special-key` to test the authorization filters."
  termsOfService: http://swagger.io/terms/
  contact:
    email: apiteam@swagger.io
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: "1.0"
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
servers:
  - url: https://wmapigw-gw-apic.apps.rosa.rp-bip-apic-dev.gxbr.p3.openshiftapps.com/gateway/petstore3byWMAGW/1.0
tags:
  - name: pet
    description: Everything about your Pets
    externalDocs:
      description: Find out more
      url: http://swagger.io
  - name: store
    description: Access to Petstore orders
  - name: user
    description: Operations about user
    externalDocs:
      description: Find out more about our store
      url: http://swagger.io
paths:
  /pet:
    summary: /pet
    put:
      tags:
        - pet
      summary: Update an existing pet
      description: ""
      operationId: updatePet
      parameters: []
      requestBody:
        description: Pet object that needs to be added to the store
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Pet"
            examples: {}
          application/xml:
            schema:
              $ref: "#/components/schemas/Pet"
            examples: {}
        required: true
      responses:
        "400":
          description: Invalid ID supplied
          headers: {}
          content: {}
          links: {}
        "404":
          description: Pet not found
          headers: {}
          content: {}
          links: {}
        "405":
          description: Validation exception
          headers: {}
          content: {}
          links: {}
    post:
      tags:
        - pet
      summary: Add a new pet to the store
      description: ""
      operationId: addPet
      parameters: []
      requestBody:
        description: Pet object that needs to be added to the store
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Pet"
            examples: {}
          application/xml:
            schema:
              $ref: "#/components/schemas/Pet"
            examples: {}
        required: true
      responses:
        "405":
          description: Invalid input
          headers: {}
          content: {}
          links: {}
    parameters: []
  /user/{username}:
    summary: /user/{username}
    get:
      tags:
        - user
      summary: Get user by user name
      description: ""
      operationId: getUserByName
      parameters:
        - name: username
          in: path
          description: "The name that needs to be fetched. Use user1 for testing. "
          required: true
          allowEmptyValue: false
          schema:
            type: string
            description: "The name that needs to be fetched. Use user1 for testing. "
            readOnly: false
      responses:
        "200":
          description: successful operation
          headers: {}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              examples: {}
            application/xml:
              schema:
                $ref: "#/components/schemas/User"
              examples: {}
          links: {}
        "400":
          description: Invalid username supplied
          headers: {}
          content: {}
          links: {}
        "404":
          description: User not found
          headers: {}
          content: {}
          links: {}
    put:
      tags:
        - user
      summary: Updated user
      description: This can only be done by the logged in user.
      operationId: updateUser
      parameters:
        - name: username
          in: path
          description: name that need to be updated
          required: true
          allowEmptyValue: false
          schema:
            type: string
            description: name that need to be updated
            readOnly: false
      requestBody:
        description: Updated user object
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
            examples: {}
        required: true
      responses:
        "400":
          description: Invalid user supplied
          headers: {}
          content: {}
          links: {}
        "404":
          description: User not found
          headers: {}
          content: {}
          links: {}
    delete:
      tags:
        - user
      summary: Delete user
      description: This can only be done by the logged in user.
      operationId: deleteUser
      parameters:
        - name: username
          in: path
          description: The name that needs to be deleted
          required: true
          allowEmptyValue: false
          schema:
            type: string
            description: The name that needs to be deleted
            readOnly: false
      responses:
        "400":
          description: Invalid username supplied
          headers: {}
          content: {}
          links: {}
        "404":
          description: User not found
          headers: {}
          content: {}
          links: {}
    parameters: []
  /pet/findByStatus:
    summary: /pet/findByStatus
    get:
      tags:
        - pet
      summary: Finds Pets by status
      description: Multiple status values can be provided with comma separated strings
      operationId: findPetsByStatus
      parameters:
        - name: status
          in: query
          description: Status values that need to be considered for filter
          required: true
          allowEmptyValue: false
          schema:
            type: array
            description: Status values that need to be considered for filter
            readOnly: false
            items:
              type: string
              default: available
              enum:
                - available
                - pending
                - sold
      responses:
        "200":
          description: successful operation
          headers: {}
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
              examples: {}
            application/xml:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
              examples: {}
          links: {}
        "400":
          description: Invalid status value
          headers: {}
          content: {}
          links: {}
    parameters: []
  /user/createWithList:
    summary: /user/createWithList
    post:
      tags:
        - user
      summary: Creates list of users with given input array
      description: ""
      operationId: createUsersWithListInput
      parameters: []
      requestBody:
        description: List of user object
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/User"
            examples: {}
        required: true
      responses:
        default:
          description: successful operation
          headers: {}
          content: {}
          links: {}
    parameters: []
  /pet/{petId}/uploadImage:
    summary: /pet/{petId}/uploadImage
    post:
      tags:
        - pet
      summary: uploads an image
      description: ""
      operationId: uploadFile
      parameters:
        - name: petId
          in: path
          description: ID of pet to update
          required: true
          allowEmptyValue: false
          schema:
            type: integer
            description: ID of pet to update
            format: int64
            readOnly: false
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                additionalMetadata:
                  type: string
                  description: Additional data to pass to server
                  readOnly: false
                file:
                  type: string
                  description: file to upload
                  format: binary
                  readOnly: false
            examples: {}
        required: true
      responses:
        "200":
          description: successful operation
          headers: {}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              examples: {}
          links: {}
    parameters: []
  /store/inventory:
    summary: /store/inventory
    get:
      tags:
        - store
      summary: Returns pet inventories by status
      description: Returns a map of status codes to quantities
      operationId: getInventory
      parameters: []
      responses:
        "200":
          description: successful operation
          headers: {}
          content:
            application/json:
              schema: {}
              examples: {}
          links: {}
    parameters: []
  /user/login:
    summary: /user/login
    get:
      tags:
        - user
      summary: Logs user into the system
      description: ""
      operationId: loginUser
      parameters:
        - name: username
          in: query
          description: The user name for login
          required: true
          allowEmptyValue: false
          schema:
            type: string
            description: The user name for login
            readOnly: false
        - name: password
          in: query
          description: The password for login in clear text
          required: true
          allowEmptyValue: false
          schema:
            type: string
            description: The password for login in clear text
            readOnly: false
      responses:
        "200":
          description: successful operation
          headers:
            X-Rate-Limit:
              description: calls per hour allowed by the user
              required: false
              schema:
                type: integer
                format: int32
              examples: {}
            X-Expires-After:
              description: date in UTC when token expires
              required: false
              schema:
                type: string
                format: date-time
              examples: {}
          content:
            application/json:
              schema:
                type: string
              examples: {}
            application/xml:
              schema:
                type: string
              examples: {}
          links: {}
        "400":
          description: Invalid username/password supplied
          headers: {}
          content: {}
          links: {}
    parameters: []
  /user:
    summary: /user
    post:
      tags:
        - user
      summary: Create user
      description: This can only be done by the logged in user.
      operationId: createUser
      parameters: []
      requestBody:
        description: Created user object
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
            examples: {}
        required: true
      responses:
        default:
          description: successful operation
          headers: {}
          content: {}
          links: {}
    parameters: []
  /user/createWithArray:
    summary: /user/createWithArray
    post:
      tags:
        - user
      summary: Creates list of users with given input array
      description: ""
      operationId: createUsersWithArrayInput
      parameters: []
      requestBody:
        description: List of user object
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/User"
            examples: {}
        required: true
      responses:
        default:
          description: successful operation
          headers: {}
          content: {}
          links: {}
    parameters: []
  /pet/findByTags:
    summary: /pet/findByTags
    get:
      tags:
        - pet
      summary: Finds Pets by tags
      description: Multiple tags can be provided with comma separated strings. Use
        tag1, tag2, tag3 for testing.
      operationId: findPetsByTags
      parameters:
        - name: tags
          in: query
          description: Tags to filter by
          required: true
          allowEmptyValue: false
          schema:
            type: array
            description: Tags to filter by
            readOnly: false
            items:
              type: string
      responses:
        "200":
          description: successful operation
          headers: {}
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
              examples: {}
            application/xml:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
              examples: {}
          links: {}
        "400":
          description: Invalid tag value
          headers: {}
          content: {}
          links: {}
      deprecated: true
    parameters: []
  /store/order:
    summary: /store/order
    post:
      tags:
        - store
      summary: Place an order for a pet
      description: ""
      operationId: placeOrder
      parameters: []
      requestBody:
        description: order placed for purchasing the pet
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Order"
            examples: {}
        required: true
      responses:
        "200":
          description: successful operation
          headers: {}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
              examples: {}
            application/xml:
              schema:
                $ref: "#/components/schemas/Order"
              examples: {}
          links: {}
        "400":
          description: Invalid Order
          headers: {}
          content: {}
          links: {}
    parameters: []
  /user/logout:
    summary: /user/logout
    get:
      tags:
        - user
      summary: Logs out current logged in user session
      description: ""
      operationId: logoutUser
      parameters: []
      responses:
        default:
          description: successful operation
          headers: {}
          content: {}
          links: {}
    parameters: []
  /pet/{petId}:
    summary: /pet/{petId}
    get:
      tags:
        - pet
      summary: Find pet by ID
      description: Returns a single pet
      operationId: getPetById
      parameters:
        - name: petId
          in: path
          description: ID of pet to return
          required: true
          allowEmptyValue: false
          schema:
            type: integer
            description: ID of pet to return
            format: int64
            readOnly: false
      responses:
        "200":
          description: successful operation
          headers: {}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
              examples: {}
            application/xml:
              schema:
                $ref: "#/components/schemas/Pet"
              examples: {}
          links: {}
        "400":
          description: Invalid ID supplied
          headers: {}
          content: {}
          links: {}
        "404":
          description: Pet not found
          headers: {}
          content: {}
          links: {}
    post:
      tags:
        - pet
      summary: Updates a pet in the store with form data
      description: ""
      operationId: updatePetWithForm
      parameters:
        - name: petId
          in: path
          description: ID of pet that needs to be updated
          required: true
          allowEmptyValue: false
          schema:
            type: integer
            description: ID of pet that needs to be updated
            format: int64
            readOnly: false
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Updated name of the pet
                  readOnly: false
                status:
                  type: string
                  description: Updated status of the pet
                  readOnly: false
            examples: {}
        required: true
      responses:
        "405":
          description: Invalid input
          headers: {}
          content: {}
          links: {}
    delete:
      tags:
        - pet
      summary: Deletes a pet
      description: ""
      operationId: deletePet
      parameters:
        - name: api_key
          in: header
          required: false
          allowEmptyValue: false
          schema:
            type: string
            readOnly: false
        - name: petId
          in: path
          description: Pet id to delete
          required: true
          allowEmptyValue: false
          schema:
            type: integer
            description: Pet id to delete
            format: int64
            readOnly: false
      responses:
        "400":
          description: Invalid ID supplied
          headers: {}
          content: {}
          links: {}
        "404":
          description: Pet not found
          headers: {}
          content: {}
          links: {}
    parameters: []
  /store/order/{orderId}:
    summary: /store/order/{orderId}
    get:
      tags:
        - store
      summary: Find purchase order by ID
      description: For valid response try integer IDs with value >= 1 and <= 10. Other
        values will generated exceptions
      operationId: getOrderById
      parameters:
        - name: orderId
          in: path
          description: ID of pet that needs to be fetched
          required: true
          allowEmptyValue: false
          schema:
            maximum: 10
            minimum: 1
            type: integer
            description: ID of pet that needs to be fetched
            format: int64
            readOnly: false
      responses:
        "200":
          description: successful operation
          headers: {}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
              examples: {}
            application/xml:
              schema:
                $ref: "#/components/schemas/Order"
              examples: {}
          links: {}
        "400":
          description: Invalid ID supplied
          headers: {}
          content: {}
          links: {}
        "404":
          description: Order not found
          headers: {}
          content: {}
          links: {}
    delete:
      tags:
        - store
      summary: Delete purchase order by ID
      description: For valid response try integer IDs with positive integer value.
        Negative or non-integer values will generate API errors
      operationId: deleteOrder
      parameters:
        - name: orderId
          in: path
          description: ID of the order that needs to be deleted
          required: true
          allowEmptyValue: false
          schema:
            minimum: 1
            type: integer
            description: ID of the order that needs to be deleted
            format: int64
            readOnly: false
      responses:
        "400":
          description: Invalid ID supplied
          headers: {}
          content: {}
          links: {}
        "404":
          description: Order not found
          headers: {}
          content: {}
          links: {}
    parameters: []
components:
  schemas:
    Order:
      type: object
      properties:
        complete:
          type: boolean
        id:
          type: integer
          format: int64
        petId:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int32
        shipDate:
          type: string
          format: date-time
        status:
          type: string
          description: Order Status
          enum:
            - placed
            - approved
            - delivered
      xml:
        name: Order
    Category:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
      xml:
        name: Category
    User:
      type: object
      properties:
        email:
          type: string
        firstName:
          type: string
        id:
          type: integer
          format: int64
        lastName:
          type: string
        password:
          type: string
        phone:
          type: string
        userStatus:
          type: integer
          description: User Status
          format: int32
        username:
          type: string
      xml:
        name: User
    Tag:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
      xml:
        name: Tag
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        type:
          type: string
    Pet:
      required:
        - name
        - photoUrls
      type: object
      properties:
        category:
          $ref: "#/components/schemas/Category"
        id:
          type: integer
          format: int64
        name:
          type: string
          example: doggie
        photoUrls:
          type: array
          xml:
            wrapped: true
          items:
            type: string
            xml:
              name: photoUrl
        status:
          type: string
          description: pet status in the store
          enum:
            - available
            - pending
            - sold
        tags:
          type: array
          xml:
            wrapped: true
          items:
            $ref: "#/components/schemas/Tag"
            xml:
              name: tag
      xml:
        name: Pet
  responses: {}
  parameters: {}
  examples: {}
  requestBodies: {}
  headers: {}
  links: {}
  callbacks: {}
